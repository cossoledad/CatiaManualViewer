- module-name: 'ctranslate2'
  dlls:
    - from_filenames:
        relative_path: '.'
        prefixes:
          - 'ctranslate2'
          - 'libiomp5md'
          - 'cudnn64_9'
      when: 'win32'
- module-name: 'onnxruntime'
  dlls:
    - from_filenames:
        relative_path: 'capi'
        prefixes:
          - 'onnxruntime'
      when: 'win32'
- module-name: 'certifi.core'
  anti-bloat:
    - description: 'resolve the bundled CA file without temporary resource extraction'
      change_function:
        'where': "'(lambda: __import__(\"os\").path.join(__import__(\"os\").path.dirname(__file__), \"cacert.pem\"))'"
      when: 'standalone'
