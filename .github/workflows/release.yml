name: Release
run-name: Portable build / ${{ github.ref_name }}

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  metadata:
    name: Check version and release notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      artifact: ${{ steps.release.outputs.artifact }}
      directory: ${{ steps.release.outputs.directory }}
      archive: ${{ steps.release.outputs.archive }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Validate tag against pyproject.toml
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            python scripts/release.py metadata --tag "$RELEASE_TAG"
          else
            python scripts/release.py metadata
          fi

  validate:
    name: Validate source
    uses: ./.github/workflows/ci.yml

  build:
    name: Build Windows x64 portable
    needs: [metadata, validate]
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packaging/constraints-ci.txt
      - name: Install build dependencies
        run: python -m pip install -c packaging/constraints-ci.txt -e ".[gui,catia,translation,offline,packaging]"
      - name: Cache pinned offline models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/offline-models
          key: argos-${{ hashFiles('packaging/models.lock.json') }}
      - name: Install and verify model archives
        run: python scripts/setup_translation.py --model-dir .cache/offline-models --lock packaging/models.lock.json
      - name: Cache Nuitka dependency scans and compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/nuitka/downloads
          key: nuitka-windows2022-msvc-py312-${{ hashFiles('packaging/constraints-ci.txt', 'packaging/nuitka-package.config.yml') }}-${{ github.sha }}
          restore-keys: |
            nuitka-windows2022-msvc-py312-${{ hashFiles('packaging/constraints-ci.txt', 'packaging/nuitka-package.config.yml') }}-
      - name: Compile and run the actual EXE self-check
        env:
          RELEASE_DIRECTORY: ${{ needs.metadata.outputs.directory }}
        run: python scripts/build_portable.py --compiler msvc --jobs 2 --models .cache/offline-models --output-dir "$env:RELEASE_DIRECTORY"
      - name: Check archive contents and create SHA-256
        env:
          RELEASE_ARCHIVE: ${{ needs.metadata.outputs.archive }}
        run: python scripts/release.py verify "$env:RELEASE_ARCHIVE" --write-checksum
      - name: Keep downloadable release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ needs.metadata.outputs.artifact }}
          path: |
            ${{ needs.metadata.outputs.archive }}
            ${{ needs.metadata.outputs.archive }}.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Keep compiler and runtime diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nuitka-diagnostics-${{ github.run_attempt }}
          path: |
            .cache/nuitka/compilation-report.xml
            .cache/nuitka/portable-runtime.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish verified tag
    needs: [metadata, build]
    # Manual dispatch is deliberately build-only, including when a tag is selected in the UI.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.metadata.outputs.artifact }}
          path: release-assets
      - name: Verify assets, create or resume draft, upload, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: python scripts/release.py publish --repo "$RELEASE_REPOSITORY" --tag "$RELEASE_TAG" --directory release-assets
