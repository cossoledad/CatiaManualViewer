name: Release
run-name: Portable build / ${{ github.ref_name }}

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  build:
    name: Build portable archive
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish verified tag
    needs: build
    # Manual dispatch is deliberately build-only, including when a tag is selected in the UI.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: release-assets
      - name: Verify assets, create or resume draft, upload, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: python scripts/release.py publish --repo "$RELEASE_REPOSITORY" --tag "$RELEASE_TAG" --directory release-assets
