[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "catia-manual-viewer"
version = "0.5.0"
description = "Local CATIA V5 documentation parser, search service and desktop reader"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = ["beautifulsoup4>=4.12,<5", "lxml>=5,<7", "charset-normalizer>=3,<4", "tomlkit>=0.13,<1"]

[project.optional-dependencies]
gui = ["PySide6>=6.8,<7"]
catia = ["pywin32>=308; sys_platform == 'win32'"]
translation = ["httpx>=0.28,<1"]
offline = ["ctranslate2>=4.6,<5", "sentencepiece>=0.2,<0.3", "httpx>=0.28,<1"]
search = ["onnxruntime>=1.22,<2", "tokenizers>=0.21,<1", "numpy>=2,<3", "httpx>=0.28,<1"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1.2,<2"]
packaging = ["Nuitka>=4.3,<5", "ordered-set>=4,<5", "zstandard>=0.23,<1"]

[project.scripts]
catia-doc = "catia_manual.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
catia_manual = ["assets/*.svg", "assets/*.png", "assets/*.ico", "assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
